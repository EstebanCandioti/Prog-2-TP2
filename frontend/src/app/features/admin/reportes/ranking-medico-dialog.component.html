<h2 mat-dialog-title>Ranking médico completo</h2>

<mat-dialog-content>
  <p class="ranking-subtitle">Todos los profesionales con turnos atendidos</p>
  <div class="ranking-chart-wrap">
    <div class="ranking-chart" [style.height.px]="alturaGrafico">
      <canvas #rankingCanvas role="img" aria-label="Ranking completo de médicos por turnos atendidos"></canvas>
    </div>
  </div>
  <div class="ranking-table-wrap">
    <table mat-table [dataSource]="ranking" class="ranking-table" aria-label="Ranking médico completo">
      <ng-container matColumnDef="posicion">
        <th mat-header-cell *matHeaderCellDef>Posición</th>
        <td mat-cell *matCellDef="let medico; let posicion = index">{{ posicion + 1 }}</td>
      </ng-container>
      <ng-container matColumnDef="medico">
        <th mat-header-cell *matHeaderCellDef>Médico</th>
        <td mat-cell *matCellDef="let medico">{{ medico.nombreCompleto }}</td>
      </ng-container>
      <ng-container matColumnDef="atendidos">
        <th mat-header-cell *matHeaderCellDef>Atendidos</th>
        <td mat-cell *matCellDef="let medico">{{ medico.turnosAtendidos | number:'1.0-0' }}</td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="columnas"></tr>
      <tr mat-row *matRowDef="let row; columns: columnas"></tr>
    </table>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" mat-dialog-close>
    <mat-icon>close</mat-icon>
    Cerrar
  </button>
</mat-dialog-actions>
